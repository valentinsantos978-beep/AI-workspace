name: NexusAI Build
on:
  workflow_dispatch:
    inputs:
      runtime: { description: 'Runtime', required: true, default: 'python' }
      setup_command: { description: 'Setup', default: '' }
      build_command: { description: 'Build', required: true, default: 'echo ok' }
      artifact_name: { description: 'Nome', required: true, default: 'output' }
      artifact_path: { description: 'Path', required: true, default: '**/*' }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: inputs.runtime == 'python'
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        if: inputs.runtime == 'node'
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        if: inputs.runtime == 'java'
        with: { distribution: 'temurin', java-version: '17' }
      - name: Setup
        if: inputs.setup_command != ''
        run: ${{ inputs.setup_command }}
      - name: Build
        run: ${{ inputs.build_command }}
      - name: List
        run: ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: warn
          retention-days: 30
